modLoader = "javafml"
loaderVersion = "*"
license = "GPL-3.0-or-later"
issueTrackerURL="https://EclipsedReaper/PersistentOptions/issues"

[[mods]]
modId = "persistent_options"
version = "${version}"
displayName = "${name}"
authors = "EclipsedReaper"
description = "Persistent Options is a client-side mod that remembers and restores your settings between Minecraft instances."
logoFile = "assets/persistent_options/icon.png"
logoBlur = false

[[mixins]]
config = "persistent_options-common.mixins.json"

[[mixins]]
config = "persistent_options-neoforge.mixins.json"