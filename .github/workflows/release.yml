name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: chmod +x ./gradlew

      - run: ./gradlew buildAndCollect

      - run: |
          awk '/^## \[/ { if (count++) exit } count { print }' CHANGELOG.md > latest_changelog.md

      - run: |
          mkdir -p staging
          find build/libs -type f -name "*.jar" -exec cp {} staging/ \;
          rm -f staging/*-sources.jar

      - uses: softprops/action-gh-release@v2
        with:
          body_path: latest_changelog.md
          files: staging/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: |
            staging/
            latest_changelog.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            mc-version: "1.20.1"
          - loader: fabric
            mc-version: "1.20.4"
          - loader: fabric
            mc-version: "1.21.1"
          - loader: fabric
            mc-version: "1.21.3"
          - loader: fabric
            mc-version: "1.21.4"
          - loader: fabric
            mc-version: "1.21.5"
          - loader: fabric
            mc-version: "1.21.6"
          - loader: fabric
            mc-version: "1.21.7"
          - loader: fabric
            mc-version: "1.21.8"
          - loader: fabric
            mc-version: "1.21.9"
          - loader: fabric
            mc-version: "1.21.10"
          - loader: fabric
            mc-version: "1.21.11"
          - loader: neoforge
            mc-version: "1.20.4"
          - loader: neoforge
            mc-version: "1.21.1"
          - loader: neoforge
            mc-version: "1.21.3"
          - loader: neoforge
            mc-version: "1.21.4"
          - loader: neoforge
            mc-version: "1.21.5"
          - loader: neoforge
            mc-version: "1.21.6"
          - loader: neoforge
            mc-version: "1.21.7"
          - loader: neoforge
            mc-version: "1.21.8"
          - loader: neoforge
            mc-version: "1.21.9"
          - loader: neoforge
            mc-version: "1.21.10"
          - loader: neoforge
            mc-version: "1.21.11"
          - loader: forge
            mc-version: "1.20.1"
          - loader: forge
            mc-version: "1.20.4"

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-jars

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: "OAxJpW9U"
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: "1409359"
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: staging/*${{ matrix.loader }}*${{ matrix.mc-version }}.jar
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.mc-version }}
          changelog-file: latest_changelog.md